services:
  - type: web
    name: picklerank-api
    plan: starter
    runtime: python
    rootDir: backend
    buildCommand: pip install -e ".[dev]"
    startCommand: bash -lc 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: PICKLERANK_ENV
        value: production
      - key: PICKLERANK_APP_NAME
        value: PickleRank API
      - key: PICKLERANK_API_V1_PREFIX
        value: ""
      - key: PICKLERANK_CORS_ORIGINS
        sync: false
      - key: PICKLERANK_AUTH_TOKEN_SECRET
        generateValue: true
      - key: PICKLERANK_AUTH_TOKEN_TTL_MINUTES
        value: "10080"
      - key: PICKLERANK_ADMIN_USERNAME
        value: admin
      - key: PICKLERANK_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: picklerank-db
          property: connectionString

databases:
  - name: picklerank-db
    plan: free
    databaseName: picklerank
    user: picklerank
