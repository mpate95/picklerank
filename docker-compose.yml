services:
  postgres:
    image: postgres:16
    container_name: picklerank-postgres
    environment:
      POSTGRES_DB: picklerank
      POSTGRES_USER: picklerank
      POSTGRES_PASSWORD: picklerank
    ports:
      - "5432:5432"
    volumes:
      - picklerank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picklerank -d picklerank"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picklerank-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PICKLERANK_ENV: local
      PICKLERANK_DB_HOST: postgres
      PICKLERANK_DB_PORT: 5432
      PICKLERANK_DB_NAME: picklerank
      PICKLERANK_DB_USER: picklerank
      PICKLERANK_DB_PASSWORD: picklerank
      PICKLERANK_CORS_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
      PICKLERANK_AUTH_TOKEN_SECRET: picklerank-dev-secret
      PICKLERANK_ADMIN_USERNAME: admin
      PICKLERANK_ADMIN_PASSWORD: changeme-admin-password
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      bash -lc "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: picklerank-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  picklerank_postgres_data:
  frontend_node_modules:
