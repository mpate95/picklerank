services:
  postgres:
    image: postgres:16
    container_name: picklerank-postgres
    environment:
      POSTGRES_DB: picklerank
      POSTGRES_USER: picklerank
      POSTGRES_PASSWORD: picklerank
    ports:
      - "5432:5432"
    volumes:
      - picklerank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picklerank -d picklerank"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  picklerank_postgres_data:
